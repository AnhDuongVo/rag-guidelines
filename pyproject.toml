[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-guidelines"
version = "0.1.0"
description = "Retrieval-augmented generation over public clinical guidelines and drug labels, with every answer verified against its cited source. Neutral, OpenAI-compatible stack."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Maria (Anh Duong Vo)" }]
keywords = ["rag", "retrieval", "healthcare", "guidelines", "citation", "grounding", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6", "typer>=0.12", "rich>=13", "python-dotenv>=1.0"]

[project.optional-dependencies]
live = ["openai>=1.40"]
dev = ["pytest>=8", "ruff==0.16.10"]

[project.scripts]
rag = "rag_guidelines.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
